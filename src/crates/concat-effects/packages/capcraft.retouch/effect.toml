format = 2

# CapCraft's retouch: skin smoothed and brightened, the rest of the picture
# left as it is. Skin is where the skin model found it (MediaPipe's
# multiclass selfie segmentation, handed over as the pass's map), or by its
# colour where a clip has not been analysed. Written for CapCraft for Android (AGPL-3.0-or-later).

[effect]
id = "capcraft.retouch"
name = "Retouch"
version = 1
kind = "effect"
category = "Cutout"
order = 65
intensity = "soften"
description = "Smooths and brightens skin: the face's and the body's, as the skin model finds them, or by its colour until it has."

[[param]]
key = "soften"
label = "Smooth"
type = "int"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "brighten"
label = "Brighten"
type = "int"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
