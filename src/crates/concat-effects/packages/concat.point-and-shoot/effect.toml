format = 2

[effect]
id = "concat.point-and-shoot"
# Forge: the name Concat 0.2.8 gave it, which Forge 0.0.8 projects hold.
aliases = ["concat.digicam"]
name = "Point and Shoot"
kind = "filter"
category = "Retro"
order = 45
intensity = "flash"
description = "The 2000s point-and-shoot: hard flash, whites blown, colour up, a cool cyan cast, over-sharpened with the sensor's noise."

[[param]]
key = "flash"
label = "Flash"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "noise"
label = "Noise"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
