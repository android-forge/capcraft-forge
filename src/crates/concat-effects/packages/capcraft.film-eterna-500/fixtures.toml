[[probe]]
name = "default, skin"
input = [0.6, 0.35, 0.25, 1]
expect = [0.65723, 0.43823, 0.33057, 1.0]

[[probe]]
name = "minimum, as shot"
at = "min"
input = [0.45, 0.4, 0.35, 1]
