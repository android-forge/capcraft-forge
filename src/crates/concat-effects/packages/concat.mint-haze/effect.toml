format = 2

[effect]
id = "concat.mint-haze"
# Forge: the name Concat 0.2.8 gave it, which Forge 0.0.8 projects hold.
aliases = ["concat.matcha"]
name = "Mint Haze"
kind = "filter"
category = "Stylised"
order = 53
intensity = "amount"
description = "Soft green through the midtones and whites, colour muted, a light matte. The trend look, gentle enough for a face."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
