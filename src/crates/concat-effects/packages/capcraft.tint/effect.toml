format = 2

# CapCraft's tint: the picture washed in one colour, its light and shade
# kept, as red for anger or blue for cold. Put on a person's cut-out copy
# by the people tools, its amount keyed to make it grow.
# Written for CapCraft Forge (AGPL-3.0-or-later).

[effect]
id = "capcraft.tint"
name = "Tint"
version = 1
kind = "effect"
category = "Color"
order = 13
intensity = "amount"
description = "Washes the picture in one colour, its light and shade kept."

# A strong red, fully opaque (red, green, blue, alpha).
[[param]]
key = "color"
label = "Colour"
type = "color"
min = 0
max = 4294967295
default = 4280949503

[[param]]
key = "amount"
label = "Amount"
type = "int"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
