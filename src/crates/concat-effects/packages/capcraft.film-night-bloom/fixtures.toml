# Colours in the working space, 1.0 the white of an SDR picture. Pinned from
# the shader as first written, so the look stays what it was.

[[probe]]
name = "default, skin"
input = [0.6, 0.35, 0.25, 1]
expect = [0.60645, 0.37109, 0.33398, 1.0]

[[probe]]
name = "minimum, as shot"
at = "min"
input = [0.45, 0.4, 0.35, 1]
