# The probed pixel is the middle of a square picture. At the default the
# light falls on it whole: a grey is brightened by most of the light, a
# dark colour by all of it, and white by none. With no light nothing moves;
# at the far corner with the widest round and the most light, the middle
# takes what reaches it. Pinned from a model of the shader in doubles.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.38576, 0.38576, 0.38576, 1]

[[probe]]
name = "default, a shadow"
input = [0.05, 0.05, 0.05, 1]
expect = [0.11487, 0.11487, 0.11487, 1]

[[probe]]
name = "default, white is left alone"
input = [1, 1, 1, 1]
expect = [1, 1, 1, 1]

[[probe]]
name = "minimum, a grey as it was"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a grey lit from the far corner"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.527146, 0.527146, 0.527146, 1]
