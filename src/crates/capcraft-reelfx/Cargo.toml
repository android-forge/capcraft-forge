[package]
name = "capcraft-reelfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Forge's reel effects: talking-head effects drawn on a clip's own frames, around the person and the face that are tracked in it. Ported from Vibha Ramprakash's claude-video-effects (MIT)."

[dependencies]
concat-text.workspace = true
# Fill, stroke and anti-aliasing of the effects' cards, words and lines.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Glyph outlines for the effects' words, the faces' variable weights included.
ttf-parser = "0.25"

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
